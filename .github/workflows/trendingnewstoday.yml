name: Trending News Today (TikTok)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Run every hour at minute 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACTIONS_STEP_DEBUG: true
      GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
      gemini_api_key: ${{ secrets.gemini_api_key }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      token_github: ${{ secrets.token_github }}

    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python base packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "beautifulsoup4==4.9.1"
          python -m pip install "dateparser==0.7.6"
          python -m pip install "requests==2.27.1"
          python -m pip install "feedparser==6.0.8"
          python -m pip install zernio
          pip install -r requirements.txt

      - name: Update system package lists
        run: sudo apt-get update

      - name: Install ImageMagick, Ghostscript & Fonts
        run: |
          sudo apt-get install -y imagemagick ghostscript fonts-dejavu-core fonts-freefont-ttf fonts-roboto --fix-missing

      - name: Update ImageMagick Policy for MoviePy
        run: |
          sudo sed -i 's/<policy domain="resource" name="width" value="16KP"/<policy domain="resource" name="width" value="32KP"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="resource" name="height" value="16KP"/<policy domain="resource" name="height" value="32KP"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="resource" name="width" value="16KP"/<policy domain="resource" name="width" value="32KP"/' /etc/ImageMagick-7/policy.xml || true
          sudo sed -i 's/<policy domain="resource" name="height" value="16KP"/<policy domain="resource" name="height" value="32KP"/' /etc/ImageMagick-7/policy.xml || true
          sudo sed -i 's/rights="none"/rights="read|write"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/rights="none"/rights="read|write"/' /etc/ImageMagick-7/policy.xml || true

      - name: Install MoviePy & TTS Dependencies
        run: |
          pip install moviepy==1.0.3
          pip install torch kokoro soundfile

      - name: Execute Trending News Video Generation & TikTok Publishing
        run: python trendingnow.py
